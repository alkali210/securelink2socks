# 先启动 securelink2socks.exe serve；在 FlClash 中使用「规则」模式。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
find-process-mode: always
tun:
  enable: false
sniffer:
  enable: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  respect-rules: false
  nameserver:
    - https://223.5.5.5/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query

# 校园域名直接交给 XMU SOCKS，由 VPN 内的 DNS 解析并核对 ACL。
# 不要用 hosts 把仅有域名授权的目标改成 IP，否则会丢失域名授权信息。
# 检测页的 IPv4 脚本与主页为同一服务，使用服务器授予的主页域名授权。
# 这是域名别名，不是静态 IP；TLS 仍校验原始 ip4.xmu.edu.cn 主机名。
hosts:
  ip4.xmu.edu.cn: ip.xmu.edu.cn

proxies:
  - name: XMU
    type: socks5
    server: 127.0.0.1
    port: 1080
    udp: false

rules:
  # 优先放行 VPN 本身，避免 TUN/系统代理把外层连接再次送进 VPN。
  - PROCESS-NAME,securelink2socks.exe,DIRECT
  - PROCESS-NAME,securelink2socks,DIRECT
  - DOMAIN,svpnlink.xmu.edu.cn,DIRECT
  - DOMAIN,svpnsso.xmu.edu.cn,DIRECT
  # 校内应用跳转到的公网统一认证入口，不属于 VPN 数据资源。
  - DOMAIN,ids.xmu.edu.cn,DIRECT
  - IP-CIDR,219.229.81.217/32,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  # 校园 TCP 走 SecureLink；校园 UDP 明确拒绝，避免落到公网出口。
  - AND,((DOMAIN-SUFFIX,xmu.edu.cn),(NETWORK,UDP)),REJECT
  - DOMAIN-SUFFIX,xmu.edu.cn,XMU
  # 检测页的 IPv4 字面量也走校园出口。
  - AND,((NETWORK,UDP),(IP-CIDR,210.34.0.61/32,no-resolve)),REJECT
  - IP-CIDR,210.34.0.61/32,XMU,no-resolve
  # 已验证的校内地址；其他校内 IP 可按需在这里添加。
  - AND,((NETWORK,UDP),(IP-CIDR,172.27.75.118/32,no-resolve)),REJECT
  - IP-CIDR,172.27.75.118/32,XMU,no-resolve
  # 普通互联网直接访问；校园规则失败不会继续匹配此规则。
  - MATCH,DIRECT
